<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Protocolo HPK</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--h:#D85A30;--p:#7F77DD;--k:#1D9E75;--bg:#0A0A0B;--bg2:#131315;--bg3:#1A1A1C;--border:rgba(255,255,255,0.07);--text:#F0EFE8;--muted:#5A5A62;--score:#F5A623}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.5s ease}
#loading.hide{opacity:0;pointer-events:none}
.ld-logo{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.28em;color:var(--muted);text-transform:uppercase;margin-bottom:28px}
.ld-bar-wrap{width:100px;height:1px;background:var(--border);overflow:hidden}
.ld-bar{height:100%;background:var(--score);animation:lb 1.4s ease forwards}
@keyframes lb{from{width:0}to{width:100%}}
#app{max-width:430px;margin:0 auto;min-height:100vh;opacity:0;transform:translateY(12px);transition:opacity 0.4s ease,transform 0.4s ease}
#app.visible{opacity:1;transform:translateY(0)}
.hdr{padding:28px 20px 20px;border-bottom:1px solid var(--border);position:relative;background:var(--bg)}
.hdr-ey{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.22em;text-transform:uppercase;margin-bottom:6px}
.hdr-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;line-height:1.1}
.hdr-title b{color:var(--score)}
.hdr-right{position:absolute;top:28px;right:20px;text-align:right}
.badge{display:inline-block;font-family:'DM Mono',monospace;font-size:8px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:rgba(29,158,117,0.12);color:var(--k);border:1px solid rgba(29,158,117,0.25)}
.hdr-sem{font-size:10px;color:var(--muted);margin-top:5px;font-family:'DM Mono',monospace}
.mts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.mt{background:var(--bg);padding:18px 14px;text-align:center}
.mt-lbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:7px}
.mt-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;line-height:1}
.mt-val.sc{color:var(--score)}
.mt-sub{font-size:9px;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace}
.mt-sub.up{color:var(--k)}.mt-sub.dn{color:var(--h)}
.card{margin:14px 14px 0;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px}
.card:last-child{margin-bottom:14px}
.ct{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0.18em;margin-bottom:18px}
.ya-card{margin:14px 14px 0;background:rgba(29,158,117,0.05);border:1px solid rgba(29,158,117,0.18);border-radius:12px;padding:20px;text-align:center}
.ya-card p{color:var(--k);font-size:13px;font-weight:500;margin-bottom:3px}
.ya-card span{color:var(--muted);font-size:10px;font-family:'DM Mono',monospace}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sl{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);width:66px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.07em}
.sr input[type=range]{flex:1;-webkit-appearance:none;height:2px;background:var(--bg3);border-radius:1px;outline:none}
.sr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--text);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--border)}
.sv{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;width:14px;text-align:right}
.tsec{margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.nr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nl{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text)}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ni{width:60px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;text-align:center;outline:none;-webkit-appearance:none}
.ni:focus{border-color:var(--score)}
.tr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tr:last-child{margin-bottom:0}
.ti{display:flex;align-items:center;gap:9px}
.tn{font-size:11px;color:var(--text)}
.ts2{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:1px}
.sw{position:relative;width:38px;height:21px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.swt{position:absolute;inset:0;background:var(--bg3);border:1px solid var(--border);border-radius:11px;cursor:pointer;transition:.2s}
.swt:before{content:'';position:absolute;width:13px;height:13px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.2s}
input:checked+.swt{background:rgba(29,158,117,0.18);border-color:var(--k)}
input:checked+.swt:before{transform:translateX(17px);background:var(--k)}
.btn-save{width:100%;margin-top:18px;padding:13px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:.2s;-webkit-appearance:none}
.btn-save.ok{background:rgba(29,158,117,0.1);border-color:var(--k);color:var(--k)}
.btn-save:disabled{opacity:0.4}
.er{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.er:last-child{margin-bottom:0}
.el{font-family:'Syne',sans-serif;font-size:12px;font-weight:800;width:12px;flex-shrink:0}
.eb{flex:1}
.eh{display:flex;justify-content:space-between;margin-bottom:5px}
.en{font-size:9px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.07em}
.ep{font-family:'Syne',sans-serif;font-size:11px;font-weight:700}
.etk{height:2px;background:var(--bg3);border-radius:1px;overflow:hidden}
.ef{height:100%;border-radius:1px;transition:width .5s ease}
.pi{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.pi:last-child{border-bottom:none;padding-bottom:0}
.pd{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}
.pn{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px}
.pw{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;line-height:1.5}
.cw{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.ce{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:8px}
.cb{display:flex;align-items:flex-end;gap:3px;height:48px}
.cbar{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.cd{display:flex;gap:3px;margin-top:4px}
.cdt{flex:1;font-family:'DM Mono',monospace;font-size:7px;color:var(--muted);text-align:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:11px 22px;border-radius:22px;font-family:'DM Mono',monospace;font-size:11px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(29,158,117,0.35);color:var(--k)}
.toast.err{border-color:rgba(216,90,48,0.35);color:var(--h)}
.err-box{padding:40px 20px;text-align:center;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;line-height:1.8}
.retry-btn{margin-top:16px;background:none;border:1px solid var(--border);color:var(--muted);padding:8px 18px;border-radius:6px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em}
</style>
</head>
<body>
<div id="loading">
  <div class="ld-logo">Protocolo HPK</div>
  <div class="ld-bar-wrap"><div class="ld-bar"></div></div>
</div>
<div id="app"><div id="root"></div></div>
<div class="toast" id="toast"></div>
<script>
var API="https://script.google.com/macros/s/AKfycbwzc6lW6PA4cuIJNgWy4Bnlip10UtabrOcQbCdOOh6Knf4UI64XMkS5P9DutjszzYXY/exec";
var CH="#D85A30",CP="#7F77DD",CK="#1D9E75",CS="#F5A623";
var estado={};

async function callAPI(action,body){
  if(action==="getEstado"){
    var r=await fetch(API+"?action=getEstado&t="+Date.now());
    return r.json();
  }
  var r=await fetch(API,{method:"POST",body:JSON.stringify({action:action,...body})});
  return r.json();
}

async function init(){
  try{
    estado=await callAPI("getEstado");
    render();
    setTimeout(function(){
      document.getElementById("loading").classList.add("hide");
      document.getElementById("app").classList.add("visible");
    },1200);
  }catch(e){
    document.getElementById("root").innerHTML='<div class="err-box">Error al conectar con el servidor.<br><button class="retry-btn" onclick="init()">Reintentar</button></div>';
    document.getElementById("loading").classList.add("hide");
    document.getElementById("app").classList.add("visible");
  }
}

function render(){
  var dia=estado.dia||1,fase=estado.fase||"Activacion",durFase=estado.durFase||28;
  var racha=estado.racha||0,us=estado.ultimoScore,tend=estado.tendencia;
  var yaReg=estado.yaRegistroHoy||false,hist=estado.historial||[];
  var ds=(us!==null&&us!==undefined)?us:"--";
  var td=(tend!==null&&tend!==undefined)?((tend>0?"+":"")+tend):"--";
  var tc=tend>0?"up":tend<0?"dn":"";
  var ult=hist.length?hist[hist.length-1]:null;
  var ejH=ult?Math.min(Math.round(ult.eje_h*10),100):0;
  var ejP=ult?Math.min(Math.round(ult.eje_p*10),100):0;
  var ejK=ult?Math.min(Math.round(ult.eje_k*10),100):0;

  document.getElementById("root").innerHTML=
  '<div class="hdr">'+
    '<div class="hdr-ey">Protocolo HPK</div>'+
    '<div class="hdr-title">Dia <b>'+dia+'</b> — '+fase+'</div>'+
    '<div class="hdr-right"><div class="badge">'+fase+'</div><div class="hdr-sem">Sem '+Math.ceil(dia/7)+' / '+Math.ceil(durFase/7)+'</div></div>'+
  '</div>'+
  '<div class="mts">'+
    '<div class="mt"><div class="mt-lbl">Score</div><div class="mt-val sc" id="sc">'+ds+'</div><div class="mt-sub">hoy</div></div>'+
    '<div class="mt"><div class="mt-lbl">Racha</div><div class="mt-val">'+racha+'<span style="font-size:13px;color:var(--muted)">d</span></div><div class="mt-sub">dias</div></div>'+
    '<div class="mt"><div class="mt-lbl">Tendencia</div><div class="mt-val">'+td+'</div><div class="mt-sub '+tc+'">vs ayer</div></div>'+
  '</div>'+
  (yaReg?
    '<div class="ya-card"><p>Registro de hoy guardado</p><span>Inmutable. Volve manana.</span></div>'
  :
    '<div class="card">'+
      '<div class="ct">Registrar ahora</div>'+
      slRow("Energia","sl-e","v-e")+
      slRow("Foco","sl-f","v-f")+
      slRow("Humor","sl-h","v-h")+
      slRow("Sueno h","sl-s","v-s")+
      '<div class="tsec">'+
        numRow(CH,"Ayuno (h)","ia",16)+
        numRow(CP,"Lectura (min)","il",20)+
        togRow(CK,"Entrene hoy","HIIT / combate / fuerza","ten")+
        togRow(CH,"Ducha fria","Minimo 2 minutos","tfr")+
        togRow(CP,"Cierre nocturno","Oscuridad antes 22h","tci")+
      '</div>'+
      '<button class="btn-save" id="bsv" onclick="guardar()">Guardar registro</button>'+
    '</div>'
  )+
  '<div class="card">'+
    '<div class="ct">Estado de ejes</div>'+
    ejeRow(CH,"H","Hormonal","bar-h","pct-h",ejH)+
    ejeRow(CP,"P","Psico-cognitivo","bar-p","pct-p",ejP)+
    ejeRow(CK,"K","Kinetico","bar-k","pct-k",ejK)+
    renderChart(hist)+
  '</div>'+
  '<div class="card">'+
    '<div class="ct">Protocolo hoy</div>'+
    proto(CH,"Ayuno activo hasta las 12h","GLP-1 + dopamina matutina")+
    proto(CK,"HIIT 25 min - rounds 40/20","GLP-1 endogeno + noradrenalina")+
    proto(CP,"Lectura 20 min post-entreno","BDNF elevado - aprendizaje acelerado")+
    proto(CH,"Ducha fria 2 min","Noradrenalina + dopamina 2-3h")+
    proto(CP,"Registra antes de las 23:59","Registro inmutable - huella real")+
    proto(CK,"Cierre: oscuridad a las 22h","Melatonina + GH nocturna")+
  '</div>';

  live();
}

function slRow(lbl,sid,vid){
  return '<div class="sr"><span class="sl">'+lbl+'</span><input type="range" min="1" max="10" value="7" step="1" id="'+sid+'" oninput="live()"><span class="sv" id="'+vid+'">7</span></div>';
}
function numRow(c,lbl,id,val){
  return '<div class="nr"><div class="nl"><span class="dot" style="background:'+c+'"></span>'+lbl+'</div><input type="number" class="ni" id="'+id+'" min="0" max="120" value="'+val+'"></div>';
}
function togRow(c,name,sub,id){
  return '<div class="tr"><div class="ti"><span class="dot" style="background:'+c+'"></span><div><div class="tn">'+name+'</div><div class="ts2">'+sub+'</div></div></div><label class="sw"><input type="checkbox" id="'+id+'" onchange="live()"><span class="swt"></span></label></div>';
}
function ejeRow(c,l,name,bid,pid,pct){
  return '<div class="er"><span class="el" style="color:'+c+'">'+l+'</span><div class="eb"><div class="eh"><span class="en">'+name+'</span><span class="ep" style="color:'+c+'" id="'+pid+'">'+pct+'%</span></div><div class="etk"><div class="ef" id="'+bid+'" style="width:'+pct+'%;background:'+c+'"></div></div></div></div>';
}
function proto(c,n,w){
  return '<div class="pi"><div class="pd" style="background:'+c+'"></div><div><div class="pn">'+n+'</div><div class="pw">'+w+'</div></div></div>';
}

function live(){
  var e=gv("sl-e"),f=gv("sl-f"),h=gv("sl-h"),s=gv("sl-s");
  var ay=gn("ia"),lec=gn("il");
  var en=gc("ten"),fr=gc("tfr"),ci=gc("tci");
  st("v-e",e);st("v-f",f);st("v-h",h);st("v-s",s);
  var ejH=Math.min(100,Math.round((e*0.35+h*0.30+Math.min(s,10)*0.20+Math.min(ay/2,10)*0.15)*10));
  var ejP=Math.min(100,Math.round((f*0.50+Math.min(lec/6,10)*0.30+h*0.20)*10));
  var ejK=Math.round(((en?10:0)*0.40+(fr?10:0)*0.30+(ci?10:0)*0.30)*10);
  var sc=((ejH/10+ejP/10+ejK/10)/3).toFixed(1);
  setBar("bar-h","pct-h",ejH);
  setBar("bar-p","pct-p",ejP);
  setBar("bar-k","pct-k",ejK);
  st("sc",sc);
}

async function guardar(){
  var btn=document.getElementById("bsv");
  if(!btn)return;
  btn.disabled=true;btn.textContent="Guardando...";
  try{
    var res=await callAPI("guardarRegistro",{
      energia:gv("sl-e"),humor:gv("sl-h"),sueno:gv("sl-s"),foco:gv("sl-f"),
      ayuno:gn("ia"),lectura:gn("il"),
      entreno:gc("ten"),frio:gc("tfr"),cierre:gc("tci")
    });
    if(res.ok){
      btn.textContent="Guardado";btn.classList.add("ok");
      toast("Registro guardado. Huella permanente.","ok");
      setTimeout(async function(){estado=await callAPI("getEstado");render();},1400);
    }else{
      btn.disabled=false;btn.textContent="Guardar registro";
      toast(res.msg,"err");
    }
  }catch(e){
    btn.disabled=false;btn.textContent="Guardar registro";
    toast("Error de conexion","err");
  }
}

function renderChart(h){
  if(!h||h.length<2)return "";
  var bars=h.map(function(d){
    var pct=Math.round(((d.score||0)/10)*100);
    var col=d.score>=7?CK:d.score>=5?CS:CH;
    return '<div class="cbar" style="height:'+pct+'%;background:'+col+';opacity:0.7"></div>';
  }).join("");
  var dates=h.map(function(d){
    var dt=new Date(d.fecha+"T00:00:00");
    return '<div class="cdt">'+dt.getDate()+"/"+(dt.getMonth()+1)+'</div>';
  }).join("");
  return '<div class="cw"><div class="ce">Ultimos '+h.length+' dias</div><div class="cb">'+bars+'</div><div class="cd">'+dates+'</div></div>';
}

function gv(id){var el=document.getElementById(id);return el?Number(el.value):0;}
function gn(id){var el=document.getElementById(id);return el?Number(el.value)||0:0;}
function gc(id){var el=document.getElementById(id);return el?el.checked:false;}
function st(id,v){var el=document.getElementById(id);if(el)el.textContent=v;}
function setBar(bid,pid,pct){
  var b=document.getElementById(bid),p=document.getElementById(pid);
  if(b)b.style.width=Math.min(pct,100)+"%";
  if(p)p.textContent=Math.min(pct,100)+"%";
}
function toast(msg,type){
  var t=document.getElementById("toast");
  t.textContent=msg;t.className="toast show "+(type||"");
  setTimeout(function(){t.className="toast";},3200);
}

init();
</script>
</body>
</html>
